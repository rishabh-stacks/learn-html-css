<!DOCTYPE html>

<html>

  <head>
    
    <title>YouTube Clone</title>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <style>

      p{
        font-family: Roboto, Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }

      .thumbnail{
        width: 300px;
        display: block;
        height: 168.33px;
        object-fit: cover;
      }

      .search-bar{
        font-size: 20px;
        margin-left: 8px;
        display: block;
      }

      .video-title{
        width: 250px;
        margin-top: 0px;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        margin-bottom: 11px;
      }

      .video-author,.video-stats{
        font-size: 12px;
        color: rgb(96, 96, 96);
      }

      .video-author{
        margin-bottom: 4px;
      }

      .video-preview{
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }

      .channel-picture{
        display: inline-block;
        width: 50px;
        vertical-align: top;
      }

      .video-info{
        display: inline-block;
        width: 200px;
      }

      .pfp{
        width: 40px;
        border-radius: 50px;
      }

      .thumbnail-row{
        margin-bottom: 12px;
      }

    </style>
  
  </head>

  <body>
    
    <input class="search-bar" type="text" placeholder="Search">


    <div class="video-preview">
      
      <div class="thumbnail-row">
      <img class="thumbnail" src="thumbnails/mkbhd-thumbnail.webp">
      </div>

      <div>
        <div class="channel-picture">
          <img class="pfp" src="channel-pics/mkbhd.jpg">
        </div>
        
        <div class="video-info">
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>

          <p class="video-author">
            Marques Brownlee
          </p>

          <p class="video-stats">
            4.5M views &#183; 5 Years ago
          </p>
        </div>  
      </div>

    </div>


    <div class="video-preview">
      
      <div class="thumbnail-row">
        <img class="thumbnail" src="thumbnails/ufc-thumbnail.jpg">
      </div>
      
      <div> 
        <div class="channel-picture">
          <img class="pfp" src="channel-pics/ufc.jpg">
        </div>

        <div class="video-info">
          <p class="video-title">
            Khabib Nurmagomedov vs Conor McGregor | FULL FIGHT | UFC Classic
          </p>

          <p class="video-author">
            UFC
          </p>

          <p class="video-stats">
            99M views &#183; 2 Years ago
          </p>
        </div>
      </div>
      

    </div>

  </body>

</html>
