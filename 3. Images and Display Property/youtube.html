  <head>
    
    <title>YouTube Clone</title>
  
    <style>

      .thumbnail{
        width: 300px;
        display: block;
        height: 168.33px;

      }

        font-size: 20px;
        margin-left: 8px;
        display: block;
      }

      .video-title{
        width: 300px;
      }

      .video-author{
        
      }

      .video-stats{
        
      }

        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }

    </style>
  
  </head>

        Khabib Nurmagomedov vs Conor McGregor | FULL FIGHT | UFC Classic
