<!DOCTYPE html>

<html>
  
  <head>
    
    <title>CSS Positions</title>
  </head>
  
  <body style="height: 1000px; padding-top: 60px; padding-left: 80px;">
    
    <div style="background-color: black; color: wheat;
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    height: 50px;
    z-index: 1;">
      Header
    </div>

    <div style="background-color: green; color: white;
    position: fixed;
    top: 50px;
    bottom: 0;
    left: 0;
    width: 70px;">
      Sidebar
      <div style="background-color: red; color: white;
      position: absolute;
      right: 0;
      top: 0;">
        X
      </div>
    </div>

    <div style="background-color: red; color: white;
    position: absolute;
    right: 10px;
    top: 60px;
    z-index: 0;">
      Position: Absolute
    </div>

    <div style="background-color: lightblue; height: 200px; width: 200px;
    position: static;">
      div 1
    </div>

    <div style="background-color: lightpink; height: 200px; width: 200px;
    position: relative;">
      div 2
      <div style="background-color: black; color: white;
      position: absolute;
      bottom: 10px;
      right: 10px;">
        5:00
      </div>
    </div>

  </body>
</html>
